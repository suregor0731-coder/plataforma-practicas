# Base de datos PostgreSQL para desarrollo y pruebas.
# Uso:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: practicas-db
    environment:
      POSTGRES_USER: practicas
      POSTGRES_PASSWORD: practicas
      POSTGRES_DB: practicas
    ports:
      - "5432:5432"
    volumes:
      - practicas-datos:/var/lib/postgresql/data
      - ./docker/crear-base-de-pruebas.sql:/docker-entrypoint-initdb.d/01-crear-base-de-pruebas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practicas -d practicas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  practicas-datos:
